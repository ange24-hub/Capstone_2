services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-SB-ISPGM}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set a permanent Laravel APP_KEY}
      APP_URL: ${APP_URL:?Set the HTTPS application URL}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-sbispgm}
      DB_USERNAME: ${DB_USERNAME:-sbispgm}
      DB_PASSWORD: ${DB_PASSWORD:?Set the application database password}
      CACHE_DRIVER: file
      FILESYSTEM_DISK: local
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      SESSION_LIFETIME: ${SESSION_LIFETIME:-30}
      SESSION_SECURE_COOKIE: "true"
      SESSION_COOKIE: ${SESSION_COOKIE:-sbispgm_session}
      BARANGAY_REGISTRATION_CODE: ${BARANGAY_REGISTRATION_CODE:?Set a private barangay registration code}
      MUNICIPAL_LGU_REGISTRATION_CODE: ${MUNICIPAL_LGU_REGISTRATION_CODE:?Set a private municipal registration code}
      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST:?Set the SMTP host}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?Set the SMTP username}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set the SMTP password}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?Set the sender email address}
      MAIL_FROM_NAME: ${APP_NAME:-SB-ISPGM}
      DOCUMENT_FEE_INDIGENCY: ${DOCUMENT_FEE_INDIGENCY:-0}
      DOCUMENT_FEE_CLEARANCE: ${DOCUMENT_FEE_CLEARANCE:-0}
      DOCUMENT_FEE_RESIDENCY: ${DOCUMENT_FEE_RESIDENCY:-0}
      DOCUMENT_FEE_BUSINESS_CLEARANCE: ${DOCUMENT_FEE_BUSINESS_CLEARANCE:-0}
      LOCAL_AI_ENABLED: "false"
      ASSISTANT_AI_ENABLED: ${ASSISTANT_AI_ENABLED:-false}
      ASSISTANT_AI_URL: http://ollama:11434
      ASSISTANT_AI_MODEL: ${ASSISTANT_AI_MODEL:-qwen2.5:1.5b}
      ASSISTANT_AI_TIMEOUT: ${ASSISTANT_AI_TIMEOUT:-20}
      MIGRATION_PREDICTION_ENABLED: "false"
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    expose:
      - "80"
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - backend
      - ai
    depends_on:
      database:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sbispgm}
      MYSQL_USER: ${DB_USERNAME:-sbispgm}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set the application database password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a separate MySQL root password}
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.3}
    profiles: [ai]
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - ai
    # Reachable by app only through Docker networking; no public port/domain.
    expose:
      - "11434"
    cpus: ${OLLAMA_CPUS:-2}
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-3g}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_storage:
  database_data:
  ollama_models:

networks:
  backend:
    driver: bridge
  ai:
    driver: bridge
