ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    # Never execute uploads as PHP or expose private/development paths.
    <LocationMatch "(?i)^/(?:storage/.*\.(?:php[0-9]?|phtml|phar)|downloads(?:/|$)|\.(?!well-known(?:/|$))|(?:vendor|database|bootstrap|config|resources|routes)(?:/|$)|composer\.(?:json|lock))">
        Require all denied
    </LocationMatch>
    <Directory /var/www/html/storage/app/public>
        Options -Indexes -ExecCGI
        AllowOverride None
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
