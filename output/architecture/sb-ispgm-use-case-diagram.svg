<text x="1300" y="2745.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#243447">Common registration, login, logout and password-recovery interactions are omitted to focus on business functions.</text>
